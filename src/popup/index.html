<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Mask</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font: 13px/1.4 system-ui, sans-serif;
        margin: 0;
        padding: 14px 16px;
        width: 268px;
      }
      h1 { font-size: 14px; margin: 0 0 12px; display: flex; align-items: center; gap: 6px; }
      .row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; }
      label { user-select: none; }
      input[type='range'] { width: 120px; }
      .val { font-variant-numeric: tabular-nums; opacity: 0.7; min-width: 34px; text-align: right; }
      .switch { position: relative; width: 40px; height: 22px; }
      .switch input { opacity: 0; width: 0; height: 0; }
      .slider {
        position: absolute; inset: 0; cursor: pointer; border-radius: 22px;
        background: #bbb; transition: 0.2s;
      }
      .slider::before {
        content: ''; position: absolute; height: 16px; width: 16px; left: 3px; top: 3px;
        background: #fff; border-radius: 50%; transition: 0.2s;
      }
      input:checked + .slider { background: #2e7d32; }
      input:checked + .slider::before { transform: translateX(18px); }

      hr { border: 0; border-top: 1px solid; opacity: 0.15; margin: 14px 0 10px; }
      .section { margin: 10px 0 0; }
      .section > label { display: block; margin-bottom: 6px; }
      select {
        width: 100%;
        font: inherit;
        padding: 5px 6px;
        border-radius: 6px;
      }
      .hint { margin: 6px 0 0; font-size: 11px; line-height: 1.35; opacity: 0.65; }
    </style>
  </head>
  <body>
    <h1>🍔 Food Mask</h1>
    <div class="row">
      <label for="enabled">Masking enabled</label>
      <span class="switch">
        <input type="checkbox" id="enabled" />
        <span class="slider"></span>
      </span>
    </div>
    <hr />

    <div class="section">
      <label for="model">Food detection model</label>
      <!-- Options are rendered from shared/models.ts so the catalog stays the
           single source of truth. -->
      <select id="model"></select>
      <p class="hint" id="modelHint"></p>
    </div>

    <script type="module" src="/src/popup/main.ts"></script>
  </body>
</html>
